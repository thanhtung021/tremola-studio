# CI + deployments (docs/DEPLOY.md)
#   every push / PR : lint, typecheck, unit tests, build, Playwright (mock backend, local server)
#   non-main branch : upload a preview version of the `tremola-preview` Worker under a branch alias,
#                     then run the @remote Playwright smoke tests against that preview URL
#   main            : deploy the production Worker `tremola` (tremolastudio.com)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://tremolastudio.com
  VITE_SITE_URL: https://tremolastudio.com
  # Public by design (browser config). Secrets live in GitHub secrets / Worker secrets only.
  PUBLIC_SUPABASE_URL: https://mzjgpajcxukiunuwsyda.supabase.co
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SaMLBMa6jQ2NcC9HWxgltQ_izEU1m4l
  WORKERS_SUBDOMAIN: thanhtungtran1002

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Build (preview flavour)
        run: bun run build
        env:
          VITE_APP_ENV: preview
      - name: Playwright browsers
        run: bunx playwright install chromium
      - name: Playwright smoke tests (mock backend)
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  preview:
    needs: verify
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Branch alias
        id: alias
        run: |
          a=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          echo "alias=$a" >> "$GITHUB_OUTPUT"
      - name: Build preview Worker
        run: bun run build
        env:
          VITE_APP_ENV: preview
          TREMOLA_WORKER_NAME: tremola-preview
          VITE_SUPABASE_URL: ${{ env.PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload preview version
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler@4 versions upload --config .output/server/wrangler.json --preview-alias "${{ steps.alias.outputs.alias }}"
      - name: Playwright browsers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx playwright install chromium
      - name: Smoke tests against the preview URL
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bunx playwright test --grep @remote
        env:
          E2E_BASE_URL: https://${{ steps.alias.outputs.alias }}-tremola-preview.${{ env.WORKERS_SUBDOMAIN }}.workers.dev

  production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile
      - name: Build production Worker
        run: bun run build
        env:
          VITE_APP_ENV: production
          TREMOLA_WORKER_NAME: tremola
          VITE_SUPABASE_URL: ${{ env.PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          VITE_GA4_ID: ${{ vars.GA4_ID }}
          VITE_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      - name: Deploy
        run: bunx wrangler@4 deploy --config .output/server/wrangler.json
